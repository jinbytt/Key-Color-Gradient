<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.42" stop-color="#F2784B" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#F2784B"/>
    </linearGradient>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.42" stop-color="#5FB89A" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#5FB89A"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <clipPath id="r"><rect width="128" height="128" rx="28"/></clipPath>
    <clipPath id="cardA"><rect x="38" y="20" width="62" height="88" rx="11"/></clipPath>
    <clipPath id="cardB"><rect x="0" y="0" width="56" height="80" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="128" height="128" fill="url(#bg)"/>

    <!-- 뒤 카드 (민트) -->
    <g transform="translate(22 34) rotate(-10)">
      <g clip-path="url(#cardB)">
        <rect width="56" height="80" fill="#DDF1E8"/>
        <rect x="18" y="10" width="20" height="34" rx="6" fill="#9FD6C1"/>
        <rect width="56" height="80" fill="url(#fadeB)"/>
      </g>
    </g>

    <!-- 앞 카드 (코랄) -->
    <g clip-path="url(#cardA)">
      <rect x="38" y="20" width="62" height="88" fill="#FFE3D3"/>
      <circle cx="69" cy="50" r="17" fill="#FFAA85"/>
      <circle cx="63" cy="44" r="5" fill="#FFD2BE"/>
      <rect x="38" y="20" width="62" height="88" fill="url(#fade)"/>
      <rect x="45" y="86" width="34" height="5" rx="2.5" fill="#FFFFFF"/>
      <rect x="45" y="95" width="22" height="4" rx="2" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>
</svg>
